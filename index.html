<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Earthdawn Character Sheet</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        /* Canonical type scale (docs/UI-GUIDELINES.md §3a). Seven steps, defined
           once here — custom properties inherit through every component's shadow
           DOM, so any ui/*.js may reference these without redefining them. Use a
           token, never a raw rem, for font-size. */
        --fs-eyebrow: 0.62rem; /* uppercase section labels (.h, h4, .k, .lab) — the floor */
        --fs-fine: 0.68rem;    /* hints, thresholds, fine print */
        --fs-small: 0.74rem;   /* dense body: chips, table rows, tiles */
        --fs-body: 0.82rem;    /* standard body, buttons, modal copy */
        --fs-value: 0.95rem;   /* inline numeric values / emphasis */
        --fs-title: 1.1rem;    /* panel & modal titles */
        --fs-hero: 1.6rem;     /* hero name / big display numbers */
      }
      body {
        margin: 0;
        background: light-dark(#f4f5f7, #12151b);
        min-height: 100vh;
      }
    </style>
    <!-- Lit self-hosted (no build step, no external runtime dependency).
         Bundle + provenance in vendor/. Relative path so it resolves at both
         "/" and the "/dev/" subpath (see WORKFLOW.md). -->
    <script type="importmap">
      {
        "imports": {
          "lit": "./vendor/lit-3.2.1.js"
        }
      }
    </script>
    <link rel="modulepreload" href="./vendor/lit-3.2.1.js" />
  </head>
  <body>
    <ed-app></ed-app>
    <script type="module" src="./app.js"></script>
  </body>
</html>
